version: '3'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  dev:
    desc: Start development environment with docker-compose
    cmds:
      - docker compose up --build

  build:
    desc: Build all services and apps
    cmds:
      - docker compose build

  test:
    desc: Run tests across monorepo
    cmds:
      - node --test packages/shared-core/tests/shared-core.test.mjs
      - node --test apps/web/tests/web-engine.test.mjs
      - powershell -Command "cd services/ai-agent; python -m unittest discover -s tests -v"

  infra:up:
    desc: Start local infrastructure containers (Postgres & Redis)
    cmds:
      - docker compose up -d postgres redis

  infra:down:
    desc: Stop local infrastructure containers
    cmds:
      - docker compose down
